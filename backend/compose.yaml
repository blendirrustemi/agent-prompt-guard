name: pijd

x-python: &python
  image: pijd-python:local
  pull_policy: never
  environment:
    DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  init:
    <<: *python
    # Build the shared image once; web and consumer use this same image.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.scripts.init_stack"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    <<: *python
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      init:
        condition: service_completed_successfully
      consumer:
        condition: service_healthy
      burst:
        condition: service_healthy
      router:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  consumer:
    <<: *python
    command: ["python", "-m", "backend.intake.consumer"]
    environment:
      DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HF_HOME: /model-cache
      P3_SIMILARITY_THRESHOLD: ${P3_SIMILARITY_THRESHOLD:-0.85}
      P3_RECENT_SECONDS: ${P3_RECENT_SECONDS:-300}
      P3_RECENT_CAPACITY: ${P3_RECENT_CAPACITY:-1000}
      P3_RECENT_MIN_SCORE: ${P3_RECENT_MIN_SCORE:-0.90}
    volumes:
      - model_cache:/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/pijd-consumer-ready').exists()"]
      interval: 5s
      timeout: 3s
      start_period: 600s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

  # P9 burst detection + P10 rate limiting; publishes to throttle_decisions for P7.
  burst:
    <<: *python
    command: ["python", "-m", "backend.stream.burst_worker"]
    environment:
      DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # P9 elastic windows, seconds:threshold (Zhu & Shasha, KDD 2003).
      BURST_WINDOWS: ${BURST_WINDOWS:-10:6,60:10,600:40}
      BURST_COOLDOWN_SECONDS: ${BURST_COOLDOWN_SECONDS:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/pijd-burst-ready').exists()"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

  # P7 score routing; throttle blocks are applied immediately and allowed routes join P4 scores.
  router:
    <<: *python
    command: ["python", "-m", "backend.stream.router_worker"]
    environment:
      DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      P7_ALLOW_MAX_SCORE: ${P7_ALLOW_MAX_SCORE:-0.30}
      P7_BLOCK_MIN_SCORE: ${P7_BLOCK_MIN_SCORE:-0.70}
      P7_SCORE_TIMEOUT_SECONDS: ${P7_SCORE_TIMEOUT_SECONDS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/pijd-router-ready').exists()"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
      consumer:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s

  agent:
    <<: *python
    command: ["python", "-m", "backend.agent.worker"]
    environment:
      DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/pijd-agent-ready').exists()"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 140s

  # P8 attack-type and repeated-pattern rolling-window snapshots.
  aggregation:
    <<: *python
    command: ["python", "-m", "backend.stream.aggregation_worker"]
    environment:
      DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
      P8_WINDOW_SECONDS: ${P8_WINDOW_SECONDS:-60}
      P8_SNAPSHOT_INTERVAL_SECONDS: ${P8_SNAPSHOT_INTERVAL_SECONDS:-10}
      P8_HISTORY_RETENTION_SECONDS: ${P8_HISTORY_RETENTION_SECONDS:-604800}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

  # P6 monitors stored P4 malicious probabilities and logs retraining alerts on drift.
  drift:
    <<: *python
    command: ["python", "-m", "backend.stream.drift_worker"]
    environment:
      DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
      P6_POLL_SECONDS: ${P6_POLL_SECONDS:-1}
      P6_BATCH_SIZE: ${P6_BATCH_SIZE:-500}
      P6_ADWIN_DELTA: ${P6_ADWIN_DELTA:-0.002}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

  # Streamlit dashboards for every team member, reading PostgreSQL: http://127.0.0.1:8501
  dashboard:
    <<: *python
    command: ["python", "-m", "streamlit", "run", "backend/dashboard/app.py",
              "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true",
              "--browser.gatherUsageStats=false"]
    environment:
      DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pijd
      POSTGRES_USER: pijd
      POSTGRES_PASSWORD: pijd
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pijd -d pijd"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Containers use kafka:9092; the host uses 127.0.0.1:9094.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by backend/scripts/create_topics.py.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  postgres_data:
  kafka_data:
  model_cache:
