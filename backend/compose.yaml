name: pijd

x-python: &python
  image: pijd-python:local
  pull_policy: never
  environment:
    DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  init:
    <<: *python
    # Build the shared image once; web and consumer use this same image.
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.scripts.init_stack"]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    <<: *python
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  consumer:
    <<: *python
    command: ["python", "-m", "backend.intake.consumer"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

  # P9 burst detection + P10 rate limiting; publishes to throttle_decisions for P7.
  burst:
    <<: *python
    command: ["python", "-m", "backend.stream.burst_worker"]
    environment:
      DATABASE_URL: postgresql://pijd:pijd@db:5432/pijd
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BURST_WINDOW_SECONDS: ${BURST_WINDOW_SECONDS:-60}
      BURST_THRESHOLD: ${BURST_THRESHOLD:-10}
      BURST_COOLDOWN_SECONDS: ${BURST_COOLDOWN_SECONDS:-300}
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pijd
      POSTGRES_USER: pijd
      POSTGRES_PASSWORD: pijd
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pijd -d pijd"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper). Containers use kafka:9092; the host uses 127.0.0.1:9094.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are created explicitly by backend/scripts/create_topics.py.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  postgres_data:
  kafka_data:
